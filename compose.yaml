name: rahban
services:
  app:
    build: .
    restart: unless-stopped
    ports: ['127.0.0.1:4310:4310']
    environment:
      LIARA_API_TOKEN: ${LIARA_API_TOKEN:-}
      LIARA_TEAM_ID: ${LIARA_TEAM_ID:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_SHARE_EVIDENCE: ${LLM_SHARE_EVIDENCE:-false}
    volumes: [app-data:/app/data]
    security_opt: ['no-new-privileges:true']
volumes:
  app-data:
