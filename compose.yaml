name: rahban
services:
  app:
    build: .
    restart: unless-stopped
    ports: ['127.0.0.1:4310:4310']
    environment:
      LIARA_API_TOKEN: ${LIARA_API_TOKEN:-}
      LIARA_TEAM_ID: ${LIARA_TEAM_ID:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_SHARE_EVIDENCE: ${LLM_SHARE_EVIDENCE:-false}
    volumes: [app-data:/app/data]
    security_opt: ['no-new-privileges:true']
  prometheus:
    image: prom/prometheus:v3.8.0
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml','--storage.tsdb.retention.time=7d']
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    security_opt: ['no-new-privileges:true']
  grafana:
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    ports: ['127.0.0.1:4311:3000']
    environment:
      GF_SECURITY_ADMIN_USER: rahban
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    security_opt: ['no-new-privileges:true']
volumes:
  app-data:
  prometheus-data:
  grafana-data:
